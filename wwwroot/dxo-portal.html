<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DxO Governance | Nexus CSPM</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'><stop offset='0%25' stop-color='%236366f1'/><stop offset='100%25' stop-color='%23a855f7'/></linearGradient></defs><circle cx='16' cy='16' r='16' fill='url(%23g)'/><rect x='11' y='11' width='10' height='10' fill='%2309090b' rx='2' transform='rotate(45 16 16)'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            background-color: #050507;
            color: #d4d4d8;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden; /* Prevent body scroll, handle scroll in content area */
        }

        .mono-font { font-family: 'JetBrains Mono', monospace; }

        .cyber-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            -webkit-mask-image: radial-gradient(circle at center, black, transparent 80%);
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            /* Using Indigo/Purple for the Governance Portal to differentiate from the main dashboard */
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.05), transparent 40%), radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.05), transparent 40%);
            filter: blur(80px); pointer-events: none;
        }

        .bento-card {
            background: linear-gradient(145deg, rgba(24, 24, 27, 0.8) 0%, rgba(9, 9, 11, 0.9) 100%);
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05), 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050507; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="antialiased selection:bg-indigo-500/30 flex h-screen">

    <div class="cyber-grid"></div>
    <div class="ambient-bg"></div>

    <!-- SIDEBAR -->
    <aside class="w-64 bg-zinc-950/80 backdrop-blur-xl border-r border-zinc-800/80 flex flex-col relative z-20">
        <!-- Logo -->
        <div class="h-20 flex items-center px-6 border-b border-zinc-800/80">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-inner">
                    <span class="text-white font-black text-xs font-mono">DxO</span>
                </div>
                <span class="text-white font-bold tracking-wide text-lg">Governance</span>
            </div>
        </div>

        <!-- Nav Links -->
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Overview
            </a>
            
            <!-- Active State -->
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 shadow-inner relative overflow-hidden group">
                <div class="absolute left-0 top-0 w-1 h-full bg-indigo-500 rounded-l-xl"></div>
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Access Requests
            </a>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                User Directory
            </a>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Audit Logs
            </a>
        </nav>

        <!-- Admin Profile Bottom -->
        <div class="p-4 border-t border-zinc-800/80 bg-zinc-950/50">
            <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-zinc-800/50 transition-colors cursor-pointer" onclick="logOut()">
                <div class="w-10 h-10 rounded-full bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold font-mono text-sm">
                    HR
                </div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-sm font-bold text-white truncate">HR Admin</p>
                    <p class="text-[10px] text-zinc-500 font-mono truncate" id="admin-email-display">Loading...</p>
                </div>
                <svg class="w-4 h-4 text-zinc-500 hover:text-rose-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" title="Log Out"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative z-10">
        
        <!-- Top Header -->
        <header class="h-20 flex items-center justify-between px-8 bg-zinc-950/30 backdrop-blur-md border-b border-zinc-800/50 sticky top-0 z-30">
            <h1 class="text-xl font-bold text-white tracking-wide">Pending Access Requests</h1>
            
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="text-xs font-bold text-zinc-400 hover:text-indigo-400 flex items-center gap-2 transition-colors">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Nexus
                </a>
                <div class="h-5 w-px bg-zinc-800"></div>
                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-bold font-mono bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 shadow-inner">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                    <span id="queue-counter">0 IN QUEUE</span>
                </span>
            </div>
        </header>

        <!-- Content Area -->
        <div class="p-8">
            <div class="bento-card overflow-hidden min-h-[500px] flex flex-col">
                
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-zinc-950/80 text-zinc-500 text-[10px] uppercase tracking-widest font-bold border-b border-zinc-800/80">
                            <th class="p-5 pl-8">Applicant</th>
                            <th class="p-5">Department</th>
                            <th class="p-5">Target System</th>
                            <th class="p-5">Date</th>
                            <th class="p-5 pr-8 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTable" class="text-sm divide-y divide-zinc-800/50">
                        <!-- Dynamic rows will go here -->
                    </tbody>
                </table>

                <!-- Empty State (Shown by default, hidden via JS if data exists) -->
                <div id="empty-state" class="flex-1 flex flex-col items-center justify-center p-12">
                    <div class="w-16 h-16 rounded-2xl bg-zinc-900/50 border border-zinc-800 flex items-center justify-center text-zinc-600 mb-4 shadow-inner">
                        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h3 class="text-lg font-bold text-zinc-300 mb-1">Queue is Empty</h3>
                    <p class="text-sm text-zinc-500 mono-font">No pending admin applications.</p>
                </div>

            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <script>
        // Custom Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const borderColor = type === 'success' ? 'border-emerald-500/30' : (type === 'error' ? 'border-rose-500/30' : 'border-indigo-500/30');
            const iconColor = type === 'success' ? 'text-emerald-400' : (type === 'error' ? 'text-rose-400' : 'text-indigo-400');
            const bgGlow = type === 'success' ? 'bg-emerald-500/10' : (type === 'error' ? 'bg-rose-500/10' : 'bg-indigo-500/10');
            const iconSvg = type === 'success' ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>` : (type === 'error' ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>` : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>`);

            toast.className = `flex items-center gap-3 px-4 py-3 bg-zinc-900/95 backdrop-blur-md border ${borderColor} rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] transform translate-y-10 opacity-0 transition-all duration-300`;
            toast.innerHTML = `<div class="p-1.5 rounded-full ${bgGlow} ${iconColor}"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">${iconSvg}</svg></div><p class="text-sm font-bold text-white tracking-wide">${message}</p>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // FIREBASE SETUP
        const firebaseConfig = { 
            apiKey: "AIzaSyD8fonHbQIJyAuq9B7jFBnQi5lamIpjxfU", 
            authDomain: "dxo-s-all.firebaseapp.com", 
            projectId: "dxo-s-all", 
            storageBucket: "dxo-s-all.firebasestorage.app", 
            messagingSenderId: "208688244462", 
            appId: "1:208688244462:web:5dd360753206ec129bf5ff" 
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const ADMIN_EMAIL = "contactus.dxo@gmail.com";

        // 🛡️ STRICT ADMIN AUTHENTICATION CHECK 🛡️
        // 1. Check if they have the hardcoded bypass token first
        if (sessionStorage.getItem('dxo_admin_auth') === 'true') {
            // Success! They came from admin-login.html
            document.getElementById('admin-email-display').textContent = ADMIN_EMAIL;
            loadPendingRequests();
        } 
        // 2. Otherwise, fallback to Firebase check
        else {
            auth.onAuthStateChanged(user => {
                if (user) {
                    if (user.email !== ADMIN_EMAIL) {
                        alert("Unauthorized Access. This portal is restricted to DxO Governance Admins.");
                        auth.signOut().then(() => window.location.href = "login.html");
                    } else {
                        document.getElementById('admin-email-display').textContent = user.email;
                        loadPendingRequests();
                    }
                } else {
                    // No token AND no Firebase login = kick out
                    window.location.href = "login.html";
                }
            });
        }

        function logOut() {
            sessionStorage.removeItem('dxo_admin_auth'); // Destroy the bypass token
            auth.signOut().then(() => window.location.href = "login.html");
        }

        // Load Pending Applications from Firestore
        function loadPendingRequests() {
            const table = document.getElementById('requestsTable');
            const emptyState = document.getElementById('empty-state');
            const counter = document.getElementById('queue-counter');

            db.collection("admin_applications").where("status", "==", "pending")
              .onSnapshot((querySnapshot) => {
                  table.innerHTML = ''; 
                  
                  if (querySnapshot.empty) {
                      emptyState.style.display = 'flex';
                      counter.textContent = "0 IN QUEUE";
                  } else {
                      emptyState.style.display = 'none';
                      counter.textContent = `${querySnapshot.size} IN QUEUE`;
                      
                      querySnapshot.forEach((doc) => {
                          const data = doc.data();
                          const dateObj = data.submittedAt ? data.submittedAt.toDate() : new Date();
                          const formattedDate = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                          
                          const email = data.userEmail || "Unknown";
                          const dept = data.department || "Engineering";
                          const target = data.requestedRole || "Nexus SOAR Access";

                          const row = document.createElement('tr');
                          row.className = "hover:bg-zinc-800/30 transition-colors group";
                          row.innerHTML = `
                              <td class="p-5 pl-8">
                                  <div class="flex items-center gap-3">
                                      <div class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 font-bold text-xs uppercase">
                                          ${email.charAt(0)}
                                      </div>
                                      <span class="font-bold text-zinc-200">${email}</span>
                                  </div>
                              </td>
                              <td class="p-5 text-zinc-400 text-sm">${dept}</td>
                              <td class="p-5">
                                  <span class="px-2.5 py-1 text-[10px] font-black uppercase rounded-md border bg-indigo-500/10 text-indigo-400 border-indigo-500/30 shadow-inner">
                                      ${target}
                                  </span>
                              </td>
                              <td class="p-5 mono-font text-xs text-zinc-500">${formattedDate}</td>
                              <td class="p-5 pr-8 text-right">
                                  <div class="flex items-center justify-end gap-2">
                                      <button onclick="updateApplicationStatus('${doc.id}', 'approved')" class="w-8 h-8 rounded-lg bg-zinc-800/50 hover:bg-emerald-500/20 border border-zinc-700/50 hover:border-emerald-500/50 text-zinc-400 hover:text-emerald-400 flex items-center justify-center transition-all group/btn" title="Approve Access">
                                          <svg class="w-4 h-4 group-hover/btn:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                      </button>
                                      <button onclick="updateApplicationStatus('${doc.id}', 'rejected')" class="w-8 h-8 rounded-lg bg-zinc-800/50 hover:bg-rose-500/20 border border-zinc-700/50 hover:border-rose-500/50 text-zinc-400 hover:text-rose-400 flex items-center justify-center transition-all group/btn" title="Reject Access">
                                          <svg class="w-4 h-4 group-hover/btn:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                                      </button>
                                  </div>
                              </td>
                          `;
                          table.appendChild(row);
                      });
                  }
              }, (error) => {
                  console.error("Error fetching applications: ", error);
                  showToast("Failed to load requests from database.", "error");
              });
        }

        function updateApplicationStatus(docId, newStatus) {
            // For hardcoded bypass, we might not have auth.currentUser, so we use the constant
            const reviewer = auth.currentUser ? auth.currentUser.email : ADMIN_EMAIL;
            
            db.collection("admin_applications").doc(docId).update({
                status: newStatus,
                reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
                reviewedBy: reviewer
            })
            .then(() => {
                if(newStatus === 'approved') {
                    showToast("Access Request Approved. SOAR execution unlocked.", "success");
                } else {
                    showToast("Access Request Rejected.", "info");
                }
            })
            .catch((error) => {
                console.error("Error updating document: ", error);
                showToast("Failed to process request.", "error");
            });
        }
    </script>
</body>
</html>
