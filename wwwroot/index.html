<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless CSPM Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8 font-sans">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 flex items-center gap-3">
            🛡️ Serverless CSPM Dashboard
        </h1>
        
        <div class="bg-slate-800 rounded-lg p-6 shadow-xl border border-slate-700">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-slate-200">Latest Audit Findings</h2>
                <button onclick="runScan()" id="scanBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded font-medium transition shadow-lg">
                    Run New Cloud Audit
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-700/50 text-slate-300 text-sm uppercase tracking-wider">
                            <th class="p-4 rounded-tl-lg">Resource</th>
                            <th class="p-4">Rule Evaluated</th>
                            <th class="p-4">Severity</th>
                            <th class="p-4">Status</th>
                            <th class="p-4">Evidence</th>
                            <th class="p-4 rounded-tr-lg">Action</th>
                        </tr>
                    </thead>
                    <tbody id="findingsTable" class="text-slate-300"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            const response = await fetch('/api/scans');
            const data = await response.json();
            const tbody = document.getElementById('findingsTable');
            tbody.innerHTML = '';
            
            if (data.length === 0) return;
            const latestScan = data[data.length - 1];
            
            latestScan.findings.forEach(finding => {
                const statusColor = finding.status === 'PASS' 
                    ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' 
                    : 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                const severityColor = finding.severity === 'CRITICAL' ? 'text-rose-500 font-bold' : 'text-amber-500 font-bold';
                
                tbody.innerHTML += `
                    <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 transition">
                        <td class="p-4 font-mono text-sm text-indigo-300">${finding.resourceIdentifier}</td>
                        <td class="p-4 text-sm">${finding.ruleCode}</td>
                        <td class="p-4 ${severityColor}">${finding.severity}</td>
                        <td class="p-4"><span class="px-2 py-1 text-xs rounded border ${statusColor}">${finding.status}</span></td>
                        <td class="p-4 text-sm text-slate-400">${finding.evidence}</td>
                        <td class="p-4 text-sm">
                            <button onclick="remediateResource('${finding.resourceIdentifier}', '${finding.ruleCode}', this)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-semibold shadow">
                                Remediate
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function remediateResource(resourceId, ruleCode, btn) {
            btn.innerText = 'Fixing...';
            btn.disabled = true;
            
            const response = await fetch('/api/remediate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ resourceIdentifier: resourceId, ruleCode: ruleCode })
            });

            if (response.ok) {
                btn.innerText = 'Fixed ✔';
                btn.className = 'bg-slate-600 text-slate-300 px-3 py-1 rounded text-xs cursor-default';
                setTimeout(runScan, 1500);
            } else {
                btn.innerText = 'Failed ✖';
                btn.className = 'bg-rose-600 text-white px-3 py-1 rounded text-xs';
            }
        }

        async function runScan() {
            const btn = document.getElementById('scanBtn');
            btn.innerText = 'Scanning AWS Environment...';
            btn.disabled = true;
            await fetch('/api/scan/run', { method: 'POST' });
            await loadData();
            btn.innerText = 'Run New Cloud Audit';
            btn.disabled = false;
        }

        loadData();
    </script>
</body>
</html>
